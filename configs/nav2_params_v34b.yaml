amcl:
  ros__parameters:
    use_sim_time: True
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_link
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 5.0
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: map
      robot_base_frame: base_link
bt_navigator:
  ros__parameters:
    use_sim_time: True
